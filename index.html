<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffebaf" />
    <meta name="description" content="Cadence — a personal budget planner: income, expenses, budgets, goals and forecasts." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Cadence — Budget Planner</title>
    <script>
      // Apply stored theme before first paint to avoid a flash.
      try {
        var p = JSON.parse(localStorage.getItem('cadence:prefs') || '{}');
        var t = (p.state && p.state.theme) || 'light';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
